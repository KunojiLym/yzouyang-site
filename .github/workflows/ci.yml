name: ci

on:
  push:
    branches: [main, uat]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy built site to GitHub Pages (overwrites the single Pages URL)"
        type: choice
        options:
          - none
          - uat
          - production
        default: none

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
      deploy_env: ${{ steps.meta.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve deploy target
        id: meta
        run: |
          TARGET="none"
          ENV_NAME=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.deploy_target }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/uat" ]; then
            TARGET="uat"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="production"
          fi
          if [ "$TARGET" = "uat" ]; then
            ENV_NAME="uat"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "production" ]; then
            ENV_NAME="github-pages"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy_target=$TARGET env=$ENV_NAME"

      - name: Lint
        run: python scripts/lint.py

      - name: Token drift check
        run: python scripts/check_token_drift.py

      - name: DIY collect smoke
        run: python scripts/test_diy_collect.py

      - name: Build (GitHub Pages base path)
        env:
          SITE_BASE_PATH: /yzouyang-site
        run: python scripts/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pagefind
        run: npx --yes pagefind@1.3.0 --site dist
      - name: Site build contract tests
        run: python scripts/test_site_build.py

      - name: Upload offline preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 14

      - name: Upload Pages artifact
        if: steps.meta.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Stylelint (token enforcement)
        run: npm run lint:css

      # e2e serves dist at /; Pages build uses /yzouyang-site asset prefixes — rebuild root for tests
      - name: Build root site for e2e
        env:
          SITE_BASE_PATH: ""
        run: python scripts/build.py

      - name: Playwright usability e2e
        run: npm run test:e2e
        env:
          CI: true

      - name: Accessibility e2e (axe-core)
        run: npm run test:a11y
        env:
          CI: true

      # Visual regression baselines are not committed yet (see
      # tests/e2e/visual.spec.mjs header comment for the one-time generation
      # steps). Run it non-blocking in the meantime so it's visible in CI
      # output without failing the build on every PR; flip continue-on-error
      # to false once __snapshots__ is committed.
      - name: Visual regression (non-blocking until baselines exist)
        run: npm run test:visual
        env:
          CI: true
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    if: needs.lint-build.outputs.should_deploy == 'true'
    needs: lint-build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.lint-build.outputs.deploy_env }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
