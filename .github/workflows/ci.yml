name: ci

on:
  push:
    branches: [main, uat]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Publish the current main release to Pages, or build a downloadable preview"
        type: choice
        options:
          - none
          - production
        default: none

permissions:
  contents: read
  actions: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    concurrency:
      group: site-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps (uv)
        run: uv sync

      - name: Docs link check
        run: uv run python scripts/check_docs_links.py

      - name: Resolve deploy target
        id: meta
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || 'none' }}
        run: uv run python scripts/release_policy.py

      - name: Release workflow contract
        run: uv run python scripts/test_release_workflow.py

      - name: Python lint
        run: uv run python scripts/lint.py

      - name: Token drift check
        run: uv run python scripts/check_token_drift.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node deps (Playwright for design-system line-height probe)
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Token drift fixtures
        run: uv run python scripts/test_check_token_drift.py

      - name: DIY collect contract
        run: uv run python scripts/test_diy_collect.py

      - name: Frontend lint (Stylelint)
        run: npm run lint:css

      # Asset prefix comes from deploy.preview_origin while preview_mode is on,
      # and from public_origin after that one flag is turned off. Do not set
      # SITE_BASE_PATH here — a hardcoded /yzouyang-site would survive cutover.
      - name: Build (GitHub Pages base path)
        env:
          SITE_UAT_BUILD: ${{ steps.meta.outputs.should_deploy != 'true' && '1' || '' }}
        run: uv run python scripts/build.py --skip-pagefind

      - name: Design system sync
        run: uv run python scripts/test_design_system_sync.py

      - name: Design system sync regressions
        run: uv run python scripts/test_design_system_sync_regressions.py

      - name: Pagefind
        run: npx --yes pagefind@1.3.0 --site dist

      - name: Site build contract tests
        run: uv run python scripts/test_site_build.py

      - name: Migration verification (C2a/C2c)
        run: uv run python scripts/verify_migration.py

      - name: Permanent article contracts
        run: uv run python scripts/test_article_routes.py

      - name: Record release artifact
        run: uv run python scripts/release_artifact.py

      - name: Upload offline preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 14

      - name: Upload Pages artifact
        if: steps.meta.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # e2e serves dist at /. Empty SITE_BASE_PATH is the local/e2e exception
      # while preview_mode is still on; it must not be used for the Pages artifact.
      - name: Build root site for e2e
        env:
          SITE_BASE_PATH: ""
        run: uv run python scripts/build.py

      - name: Playwright e2e
        run: npm run test:e2e
        env:
          CI: true

      - name: Playwright a11y
        run: npm run test:a11y
        env:
          CI: true

      # Visual regression baselines are not committed yet (see
      # tests/e2e/visual.spec.mjs header comment for the one-time generation
      # steps). Run it non-blocking in the meantime so it's visible in CI
      # output without failing the build on every PR; flip continue-on-error
      # to false once __snapshots__ is committed.
      - name: Visual regression (non-blocking until baselines exist)
        run: npm run test:visual
        env:
          CI: true
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    if: needs.lint-build.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
    needs: lint-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'
            });
            if (data.object.sha !== context.sha) {
              core.setFailed('This release is no longer main HEAD; build the current main revision.');
            }
      - id: deployment
        uses: actions/deploy-pages@v4

  # Pages/lint failure only — POST body is the Actions run URL (no site/CV content).
  # When NTFY_TOPIC_URL is unset, this job exits 0 so missing secret does not fail CI.
  notify-ntfy:
    name: ntfy on failure
    needs: [lint-build, deploy]
    if: always() && !cancelled() && (needs.lint-build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: POST ntfy topic (skip if secret unset)
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          if [ -z "${NTFY_TOPIC_URL}" ]; then
            echo "NTFY_TOPIC_URL unset — skip (add repo secret; same topic as Alertmanager is fine)"
            exit 0
          fi
          curl -fsS \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "Title: yzouyang-site CI failed" \
            -H "Priority: high" \
            -H "Tags: warning,github" \
            -d "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${NTFY_TOPIC_URL}"
